<!DOCTYPE html><!-- 0 Doctype indica qual a linguagem de programaçao que esta sendo usada, neste caso HTML-->
<html lang="pt-br"> <!-- inicio do progeto-->
<head> <!-- inicio do cabeçalro do documento. Dentro dasssa tag pode ser inseridas folhas de estilo scriptes. Os itens inseridos aparecem aqui no navegador. -->
    <meta charset="UTF-8"> <!--indica quais serão os caracters (character set ou charset) sera ultilizado para rederizar o texto da página. O UTF-8 indentifica os caracteres da língua portuguesa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- -->
    <title>Document</title>
</head> <!--fim do cabeçalho do documento-->
<body> <!---nesse espaço está contido com o conteúdo visual da página. As tags que representam texto, botões e outros, devem ser adicionadas nesse intervalo-->
    <!--um documento HMTL é composto por tags -->
</body>
</htm
